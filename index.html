<html  lang="zh-Hant-TW">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <link href="https://unpkg.com/video.js@8/dist/video-js.min.css" rel="stylesheet">
</head>

<body>
  <div id="state">正在等候直播開始......</div>
  <video
    id="my-video"
    class="video-js"
    controls
    preload="auto"
    width="800"
    height="600"
    data-setup='{}'>
    <p class="vjs-no-js">
    To view this video please enable JavaScript, and consider upgrading to a
    web browser that
      <a href="https://videojs.com/html5-video-support/" target="_blank">
      supports HTML5 video
      </a>
    </p>
  </video>
  <script src="https://unpkg.com/video.js@8/dist/video.min.js"></script>
  <script>
  var player = videojs('my-video', {techOrder: ['html5']});
  var tid;
  
  function load_stat() {
    var xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
      if (this.readyState == 4 && this.status == 200) {
        parser(this);
      }
    };
    xhttp.open("GET", "/stat", true);
    xhttp.send();
  }
  
  function parser(xml) {
    var i;
    var xmlDoc = xml.responseXML;
    var streams = xmlDoc.getElementsByTagName("stream");
    if (typeof streams[0] != 'undefined') {
      var stream_name = streams[0].childNodes[1].childNodes[0].nodeValue;
      var url = '/live/' + stream_name + '.m3u8';
      var xhr = new XMLHttpRequest();
      xhr.open('HEAD', url, true);
      xhr.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
          player.src({
            src: url,
            type: 'application/x-mpegURL'
          });
          var playPromise = player.play();
          if (playPromise !== undefined) {
            playPromise.catch(function() {});
          }
          document.getElementById("state").innerText = '直播來源： http://' + window.location.hostname + url;
          clearInterval(tid);
        }
      };
      xhr.send();
    }
  }
    
  tid = setInterval(load_stat, 1000);
  </script> 
</body>
</html>
