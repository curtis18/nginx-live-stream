name: nginx-live-stream

x-stream: &stream
  build:
    context: .
    dockerfile: Dockerfile
  image: nginx-live-stream:latest
  restart: unless-stopped
  stop_grace_period: 30s
  expose:
    - "80"
  networks:
    - streams
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s

x-control-env: &control-env
  CONTROL_USER: "${CONTROL_USER:-admin}"
  CONTROL_PASSWORD: "${CONTROL_PASSWORD:-}"
  CONTROL_PASSWORD_FILE: "${CONTROL_PASSWORD_FILE:-}"

services:
  # RTMP ingest is direct on 1935-1943.
  # HTTP is loopback-only for HAProxy on 18080-18088.
  # Public viewer URLs are HAProxy's https://streamNN.<domain>/.
  # Each container records only under /var/rec/$RECORD_SLOT.

  stream-1:
    <<: *stream
    container_name: nginx-live-1
    environment:
      <<: *control-env
      RECORD_SLOT: stream-1
      VIRTUAL_HOST: "stream01.${DOMAIN:-example.com}"
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: "stream01.${DOMAIN:-example.com}"
    ports:
      - "${RTMP_BIND:-0.0.0.0}:1935:1935"
      - "${HTTP_BIND:-127.0.0.1}:18080:80"
    volumes:
      - recordings:/var/rec
      - ./www:/www:ro
      - ./config/stream-1.json:/www/stream.json:ro

  stream-2:
    <<: *stream
    container_name: nginx-live-2
    environment:
      <<: *control-env
      RECORD_SLOT: stream-2
      VIRTUAL_HOST: "stream02.${DOMAIN:-example.com}"
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: "stream02.${DOMAIN:-example.com}"
    ports:
      - "${RTMP_BIND:-0.0.0.0}:1936:1935"
      - "${HTTP_BIND:-127.0.0.1}:18081:80"
    volumes:
      - recordings:/var/rec
      - ./www:/www:ro
      - ./config/stream-2.json:/www/stream.json:ro

  stream-3:
    <<: *stream
    container_name: nginx-live-3
    environment:
      <<: *control-env
      RECORD_SLOT: stream-3
      VIRTUAL_HOST: "stream03.${DOMAIN:-example.com}"
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: "stream03.${DOMAIN:-example.com}"
    ports:
      - "${RTMP_BIND:-0.0.0.0}:1937:1935"
      - "${HTTP_BIND:-127.0.0.1}:18082:80"
    volumes:
      - recordings:/var/rec
      - ./www:/www:ro
      - ./config/stream-3.json:/www/stream.json:ro

  stream-4:
    <<: *stream
    container_name: nginx-live-4
    environment:
      <<: *control-env
      RECORD_SLOT: stream-4
      VIRTUAL_HOST: "stream04.${DOMAIN:-example.com}"
      VIRTUAL_PORT: "80"
