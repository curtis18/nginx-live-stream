    ports:
      - "${RTMP_BIND:-0.0.0.0}:1941:1935"
      - "${HTTP_BIND:-127.0.0.1}:18086:80"
    volumes:
      - recordings:/var/rec
      - ./www:/www:ro
      - ./config/stream-7.json:/www/stream.json:ro

  stream-8:
    <<: *stream
    container_name: nginx-live-8
    environment:
      <<: *control-env
      RECORD_SLOT: stream-8
      VIRTUAL_HOST: "stream08.${DOMAIN:-example.com}"
      VIRTUAL_PORT: "80"
