    volumes:
      - recordings:/var/rec
      - ./www:/www:ro
      - ./config/stream-6.json:/www/stream.json:ro

  stream-7:
    <<: *stream
    container_name: nginx-live-7
    environment:
      <<: *control-env
      RECORD_SLOT: stream-7
