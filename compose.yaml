      - ./www:/www:ro
      - ./config/stream-8.json:/www/stream.json:ro

  stream-9:
    <<: *stream
    container_name: nginx-live-9
    environment:
      <<: *control-env
      RECORD_SLOT: stream-9
      VIRTUAL_HOST: "stream09.${DOMAIN:-example.com}"
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: "stream09.${DOMAIN:-example.com}"
    ports:
      - "${RTMP_BIND:-0.0.0.0}:1943:1935"
      - "${HTTP_BIND:-127.0.0.1}:18088:80"
    volumes:
      - recordings:/var/rec
      - ./www:/www:ro
      - ./config/stream-9.json:/www/stream.json:ro

  # Optional: delete recordings older than RECORD_RETENTION_DAYS.
  # Start with: docker compose --profile cleanup up -d
  recordings-cleanup:
    image: alpine:3.24.4
    container_name: nginx-live-cleanup
    profiles: ["cleanup"]
    restart: unless-stopped
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      RECORD_RETENTION_DAYS: ${RECORD_RETENTION_DAYS:-14}
    command: ["sh", "-c", "while true; do find /var/rec -type f -mtime +${RECORD_RETENTION_DAYS:-14} -delete; sleep 3600; done"]
    volumes:
      - recordings:/var/rec
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  recordings:
    name: nginx-live-recordings

networks:
  streams:
    name: nginx-live-net
