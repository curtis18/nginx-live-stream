    ports:
      - "${RTMP_BIND:-0.0.0.0}:1938:1935"
      - "${HTTP_BIND:-127.0.0.1}:18083:80"
    volumes:
      - recordings:/var/rec
      - ./www:/www:ro
      - ./config/stream-4.json:/www/stream.json:ro

  stream-5:
    <<: *stream
    container_name: nginx-live-5
    environment:
      <<: *control-env
      RECORD_SLOT: stream-5
      VIRTUAL_HOST: "stream05.${DOMAIN:-example.com}"
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: "stream05.${DOMAIN:-example.com}"
    ports:
      - "${RTMP_BIND:-0.0.0.0}:1939:1935"
      - "${HTTP_BIND:-127.0.0.1}:18084:80"
    volumes:
      - recordings:/var/rec
      - ./www:/www:ro
      - ./config/stream-5.json:/www/stream.json:ro

  stream-6:
