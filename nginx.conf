load_module modules/ngx_rtmp_module.so;
load_module /usr/lib/nginx/modules/ngx_http_xslt_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user nginx;
error_log stderr;
pid /var/run/nginx.pid;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    js_import stat from /etc/nginx/stat.js;

    server {
        listen 80;
        server_name _;
        root /www;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /stream.json {
            expires -1;
        }

        include /etc/nginx/control.conf;
        include /etc/nginx/publish-check.conf;

        location ~ ^/live/.+\.m3u8$ {
            root /tmp;
            types {
                application/vnd.apple.mpegurl m3u8;
            }
            expires -1;
        }

        location ~ ^/live/.+\.ts$ {
            root /tmp;
            types {
                video/mp2t ts;
            }
            expires 1h;
        }

        location = /favicon.ico {
            return 204;
        }

        location / {
            include /etc/nginx/player-auth.conf;
            try_files $uri $uri/ =404;
        }
    }
}

rtmp {
    access_log /dev/stdout;

    server {
        listen 1935;
        chunk_size 4096;
        max_connections 20;
        ping 30s;
        ping_timeout 10s;
        drop_idle_publisher 10s;

        application live {
            live on;

            hls on;
            hls_path /tmp/live;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_fragment_naming system;
            hls_cleanup on;

            record all;
            include /etc/nginx/record-path.conf;
            record_unique on;
            record_interval 1h;
            record_max_size 2048m;
            exec_record_done ffmpeg -y -i $path -c copy $dirname/$basename.mp4;

            on_publish http://127.0.0.1/internal/publish-check;
            notify_method get;
        }
    }
}
